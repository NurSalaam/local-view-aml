[project]
name = "m"
version = "0.0.0"
description = "Measuring and remedying the cost of the local view in money-laundering detection"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.7,<2.8",
    "torch-geometric>=2.6",
    "pyg_lib",
    "numpy>=2.4",
    "pandas>=3.0",
    "pyarrow>=24.0",
    "scipy>=1.17",
    "scikit-learn>=1.6",
    "lightgbm>=4.6.0",
    "networkx>=3.6",
    "matplotlib>=3.11.0",
    "tqdm>=4.68",
    "psutil>=7.2",
    "huggingface-hub>=0.36,<1",
]

[dependency-groups]
dev = [
    "ruff",
    "kaggle>=2.2.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# The study ran on macOS on Apple silicon: resolution fails unless every
# dependency has a wheel that installs there.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

# PyG's compiled extensions come from PyG's flat index of CPU builds.
[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.7.0+cpu.html"
format = "flat"
explicit = true

[tool.uv.sources]
pyg_lib = { index = "pyg" }
